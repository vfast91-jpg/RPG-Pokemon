name: Inspect Gen2 Registry Builder Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-gen2-global-registry-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore and inspect builder
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, bz2
          from pathlib import Path
          source = Path('tools/build_gen2_registry_once.py.bz2.b64')
          target = Path('/tmp/build_gen2_registry_once.py')
          target.write_bytes(bz2.decompress(base64.b64decode(source.read_text().strip())))
          text = target.read_text()
          lines = text.splitlines()
          print('BUILDER_LINES', len(lines))
          for i, line in enumerate(lines, 1):
              low = line.lower()
              if any(k in low for k in ('missing_sprites', 'expected_species', 'species_count', 'family_count', '282', '185', 'ursaluna', 'payload', 'evolution')):
                  lo=max(1,i-2); hi=min(len(lines),i+3)
                  print(f'--- {lo}:{hi} ---')
                  for n in range(lo,hi+1):
                      print(f'{n:04d}: {lines[n-1]}')
          PY
