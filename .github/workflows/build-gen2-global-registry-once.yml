name: Inspect Gen2 Registry Payload Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-gen2-global-registry-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect relevant Gen2 payload entries
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, bz2, json
          from pathlib import Path
          encoded = ''.join(Path(f'data/gen2_species_payload_v1.part{i}.b64').read_text().strip() for i in range(1,5))
          payload = json.loads(bz2.decompress(base64.b64decode(encoded)).decode('utf-8'))
          species = payload.get('species', payload)
          print('PAYLOAD_COUNT', len(species))
          for sid in ('teddiursa','ursaring','ursaluna','hoppip','snubbull'):
              print('PAYLOAD_ENTRY', sid, json.dumps(species.get(sid), ensure_ascii=False, sort_keys=True))
          PY
