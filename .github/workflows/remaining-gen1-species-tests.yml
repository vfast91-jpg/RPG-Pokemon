name: Complete Gen1 Family Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-gen1-families:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Parse project headless
        run: ./godot --headless --path . --editor --quit

      - name: Validate complete Gen1 family registry
        run: ./godot --headless --path . --script tests/gen1_remaining_species_data_test.gd

      - name: Validate Zubat-to-Poliwag attack block
        run: ./godot --headless --path . --script tests/zubat_to_poliwag_moves_runtime_test.gd
