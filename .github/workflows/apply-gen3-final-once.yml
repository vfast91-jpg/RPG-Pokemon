name: Apply Gen3 Final Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gen3-final-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-gen3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Diagnose exact Generation 3 transfer chunks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fetch_blob() {
            local sha="$1"
            local out="$2"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "${out}"
            test "$(git hash-object "${out}")" = "${sha}"
          }
          fetch_blob 72f8c05ed1d77ad4fff74450472468a745190832 /tmp/a
          fetch_blob cf333a255189f105d5ad7522584b9934e9996ffe /tmp/b
          fetch_blob f17155af7254ad10fb211373a30a576e7d633443 /tmp/c
          fetch_blob f496182b19e6fb7e4cfb91d250fe24ab7c5607ca /tmp/d
          for f in /tmp/a /tmp/b /tmp/c /tmp/d; do
            echo "=== ${f} ==="
            wc -c "${f}"
            file "${f}"
            xxd -l 32 "${f}"
            tail -c 32 "${f}" | xxd
          done
          python - <<'PY'
          import gzip, itertools, pathlib
          parts={k:pathlib.Path('/tmp/'+k).read_bytes() for k in 'abcd'}
          print('PERMUTATION CHECK')
          valid=[]
          for order in itertools.permutations('abcd'):
              raw=b''.join(parts[x] for x in order)
              try:
                  data=gzip.decompress(raw)
              except Exception as exc:
                  print(''.join(order), 'FAIL', type(exc).__name__, str(exc)[:90])
              else:
                  print(''.join(order), 'OK', len(raw), '->', len(data), data[:16])
                  valid.append((''.join(order), raw, data))
          if not valid:
              raise SystemExit('No concatenation permutation is a valid gzip stream')
          order, raw, data=valid[0]
          pathlib.Path('/tmp/gen3_payload.tar.gz').write_bytes(raw)
          print('SELECTED_ORDER', order)
          PY
          tar -tzf /tmp/gen3_payload.tar.gz | head -200
