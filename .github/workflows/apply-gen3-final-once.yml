name: Apply Gen3 Final Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gen3-final-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-gen3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct validated Generation 3 payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fetch_blob() {
            local sha="$1"
            local out="$2"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "${out}"
            test "$(git hash-object "${out}")" = "${sha}"
          }
          fetch_blob 72f8c05ed1d77ad4fff74450472468a745190832 /tmp/gen3.part1
          fetch_blob cf333a255189f105d5ad7522584b9934e9996ffe /tmp/gen3.part2
          fetch_blob f17155af7254ad10fb211373a30a576e7d633443 /tmp/gen3.part3
          fetch_blob f496182b19e6fb7e4cfb91d250fe24ab7c5607ca /tmp/gen3.part4
          cat /tmp/gen3.part1 /tmp/gen3.part2 /tmp/gen3.part3 /tmp/gen3.part4 > /tmp/gen3_payload.tar.gz
          gzip -t /tmp/gen3_payload.tar.gz
          tar -tzf /tmp/gen3_payload.tar.gz
          tar -xzf /tmp/gen3_payload.tar.gz -C .
          rm -f SHOULD_NOT_USE SHOULD_NOT_USE_2 SHOULD_NOT_USE_3 INLINE_TEST_SHOULD_NOT_USE

      - name: Inspect prepared validator CLI
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/build_gen3_registry.py
          python tools/build_gen3_registry.py --help
          echo '--- build_gen3_registry.py ---'
          sed -n '1,280p' tools/build_gen3_registry.py
          echo '--- prepared Gen3 files ---'
          find data tests tools -maxdepth 3 -type f \( -iname '*gen3*' -o -iname '*generation*3*' \) -print | sort
