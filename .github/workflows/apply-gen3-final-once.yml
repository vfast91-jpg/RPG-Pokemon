name: Apply Gen3 Final Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gen3-final-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-gen3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect exact Generation 3 payload despite transfer trailer CRC
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fetch_blob() {
            local sha="$1"
            local out="$2"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "${out}"
            test "$(git hash-object "${out}")" = "${sha}"
          }
          fetch_blob 72f8c05ed1d77ad4fff74450472468a745190832 /tmp/gen3.part1
          fetch_blob cf333a255189f105d5ad7522584b9934e9996ffe /tmp/gen3.part2
          fetch_blob f17155af7254ad10fb211373a30a576e7d633443 /tmp/gen3.part3
          fetch_blob f496182b19e6fb7e4cfb91d250fe24ab7c5607ca /tmp/gen3.part4
          sha256sum /tmp/gen3.part1 /tmp/gen3.part2 /tmp/gen3.part3 /tmp/gen3.part4
          cat /tmp/gen3.part1 /tmp/gen3.part2 /tmp/gen3.part3 /tmp/gen3.part4 > /tmp/gen3_payload.tar.gz
          python - <<'PY'
          import pathlib, struct, zlib
          p=pathlib.Path('/tmp/gen3_payload.tar.gz')
          raw=p.read_bytes()
          assert raw[:3] == b'\x1f\x8b\x08', raw[:8]
          stored_crc, stored_size = struct.unpack('<II', raw[-8:])
          d=zlib.decompressobj(-zlib.MAX_WBITS)
          data=d.decompress(raw[10:-8]) + d.flush()
          actual_crc=zlib.crc32(data) & 0xffffffff
          actual_size=len(data) & 0xffffffff
          print(f'STORED_TRAILER crc={stored_crc:08x} size={stored_size}')
          print(f'ACTUAL_STREAM  crc={actual_crc:08x} size={actual_size}')
          print('EOF', d.eof, 'UNUSED', len(d.unused_data), 'UNCONSUMED', len(d.unconsumed_tail))
          if not d.eof:
              raise SystemExit('Deflate stream itself is incomplete')
          if stored_size != actual_size:
              raise SystemExit('Transfer also has an ISIZE mismatch; refusing recovery')
          pathlib.Path('/tmp/gen3_payload.tar').write_bytes(data)
          PY
          tar -tf /tmp/gen3_payload.tar
          tar -xf /tmp/gen3_payload.tar -C .
          rm -f SHOULD_NOT_USE* INLINE_TEST_SHOULD_NOT_USE

      - name: Inspect prepared importer validator and Gen3 wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/build_gen3_registry.py
          echo '--- importer help ---'
          python tools/build_gen3_registry.py --help
          echo '--- importer source ---'
          sed -n '1,360p' tools/build_gen3_registry.py
          echo '--- Gen3 files ---'
          find . -maxdepth 4 -type f \( -iname '*gen3*' -o -iname '*generation*3*' \) -print | sort
          echo '--- main.tscn Gen3 references ---'
          grep -nEi 'gen3|generation.?3' main.tscn || true
          echo '--- runtime test ---'
          sed -n '1,320p' tests/gen3_species_runtime_test.gd
          echo '--- git status ---'
          git status --short
