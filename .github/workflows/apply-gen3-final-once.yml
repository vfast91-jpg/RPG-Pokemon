name: Apply Gen3 Final Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gen3-final-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-gen3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct prepared Generation 3 payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fetch_blob() {
            local sha="$1"
            local out="$2"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "${out}"
            test "$(git hash-object "${out}")" = "${sha}"
          }
          fetch_blob 72f8c05ed1d77ad4fff74450472468a745190832 /tmp/gen3.part1
          fetch_blob cf333a255189f105d5ad7522584b9934e9996ffe /tmp/gen3.part2
          fetch_blob f17155af7254ad10fb211373a30a576e7d633443 /tmp/gen3.part3
          fetch_blob f496182b19e6fb7e4cfb91d250fe24ab7c5607ca /tmp/gen3.part4
          cat /tmp/gen3.part1 /tmp/gen3.part2 /tmp/gen3.part3 /tmp/gen3.part4 > /tmp/gen3_payload.tar.gz
          python - <<'PY'
          import pathlib, struct, tarfile, zlib
          raw = pathlib.Path('/tmp/gen3_payload.tar.gz').read_bytes()
          if raw[:10] != bytes.fromhex('1f8b0800000000000003'):
              raise SystemExit('Unexpected gzip header')
          stored_crc, stored_size = struct.unpack('<II', raw[-8:])
          d = zlib.decompressobj(-zlib.MAX_WBITS)
          data = d.decompress(raw[10:-8]) + d.flush()
          actual_crc = zlib.crc32(data) & 0xffffffff
          actual_size = len(data) & 0xffffffff
          print(f'GZIP trailer: stored crc={stored_crc:08x}, actual crc={actual_crc:08x}, size={actual_size}')
          if not d.eof or d.unused_data or d.unconsumed_tail:
              raise SystemExit('Deflate stream is not a single complete stream')
          if stored_size != actual_size:
              raise SystemExit('ISIZE mismatch; refusing payload recovery')
          tar_path = pathlib.Path('/tmp/gen3_payload.tar')
          tar_path.write_bytes(data)
          with tarfile.open(tar_path, 'r:') as tf:
              for member in tf.getmembers():
                  p = pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'Unsafe tar member: {member.name}')
              print(f'Validated {len(tf.getmembers())} tar members')
          PY
          tar -xf /tmp/gen3_payload.tar -C .
          rm -f SHOULD_NOT_USE* INLINE_TEST_SHOULD_NOT_USE

      - name: Inspect prepared validator and runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q openpyxl
          echo '--- importer help ---'
          python tools/build_gen3_registry.py --help || true
          echo '--- importer source ---'
          sed -n '1,520p' tools/build_gen3_registry.py
          echo '--- main.tscn Gen3 references ---'
          grep -nEi 'gen3|generation.?3' main.tscn || true
          echo '--- battle demo Gen3 loader ---'
          sed -n '1,360p' scripts/battle_demo_gen3_species_v1.gd
          echo '--- runtime test ---'
          sed -n '1,420p' tests/gen3_species_runtime_test.gd
          echo '--- Gen3 workflow ---'
          sed -n '1,360p' .github/workflows/gen3-species-tests.yml
          echo '--- manifest ---'
          cat data/pokemon_database_manifest_v1.json
          echo '--- git status ---'
          git status --short
          exit 1
