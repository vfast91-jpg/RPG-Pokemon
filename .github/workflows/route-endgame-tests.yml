name: Route Endgame Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-endgame:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Parse active project
        run: ./godot --headless --path . --editor --quit

      - name: Test route milestone double bosses
        run: ./godot --headless --path . --script tests/route_milestone_double_boss_test.gd

      - name: Test 100-stage superboss endgame
        run: ./godot --headless --path . --script tests/route_endgame_100_test.gd

      - name: Test legendary landscapes and UI
        run: ./godot --headless --path . --script tests/route_legendary_landscape_ui_test.gd
