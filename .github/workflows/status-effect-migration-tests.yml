name: Status Effect Migration Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status-effect-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Parse project headless
        run: ./godot --headless --path . --editor --quit

      - name: Status effect migration regression test
        run: ./godot --headless --path . --script tests/status_effect_migration_test.gd

      - name: Major-status Aggro integrity regression test
        run: ./godot --headless --path . --script tests/status_aggro_integrity_test.gd
