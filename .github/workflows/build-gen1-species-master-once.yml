name: Build Gen1 Species Master Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-gen1-species-master-once.yml

permissions:
  contents: write

jobs:
  build-master:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and validate single species master
        run: python3 tools/build_gen1_species_master_once.py

      - name: Commit generated master to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gen1_species_all_v8.json data/gen1_database_manifest_v8.json
          git add -u data
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build single Gen1 species master registry"
          git push origin HEAD:main
