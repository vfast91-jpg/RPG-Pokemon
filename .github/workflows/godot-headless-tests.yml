name: Godot Headless Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/HEADLESS_TEST_RESULT.json
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        id: install
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Parse project headless
        id: parse
        run: ./godot --headless --path . --editor --quit

      - name: Type system smoke test
        id: type_system
        run: ./godot --headless --path . --script tests/type_system_smoke_test.gd

      - name: Special mechanics audit
        id: special_mechanics
        run: ./godot --headless --path . --script tests/special_mechanics_audit_test.gd

      - name: Evolution resolver test
        id: evolution
        run: ./godot --headless --path . --script tests/evolution_resolver_test.gd

      - name: Meta progression test
        id: meta
        run: ./godot --headless --path . --script tests/meta_progression_test.gd

      - name: Weather behavior test
        id: weather
        run: ./godot --headless --path . --script tests/weather_system_test.gd

      - name: Report test statuses
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          report_status() {
            local outcome="$1"
            local context="$2"
            local label="$3"
            local state="success"
            if [[ "$outcome" != "success" ]]; then
              state="failure"
            fi

            jq -nc \
              --arg state "$state" \
              --arg context "$context" \
              --arg description "$label: $outcome" \
              '{state:$state, context:$context, description:$description}' \
              > status.json

            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data @status.json \
              > /dev/null
          }

          report_status "${{ steps.install.outcome }}" "godot-headless/install" "Godot 4.3 install"
          report_status "${{ steps.parse.outcome }}" "godot-headless/parse" "Project parse"
          report_status "${{ steps.type_system.outcome }}" "godot-headless/type-system" "Type system smoke"
          report_status "${{ steps.special_mechanics.outcome }}" "godot-headless/special-mechanics" "Special mechanics audit"
          report_status "${{ steps.evolution.outcome }}" "godot-headless/evolution" "Evolution resolver"
          report_status "${{ steps.meta.outcome }}" "godot-headless/meta" "Meta progression"
          report_status "${{ steps.weather.outcome }}" "godot-headless/weather" "Weather behavior"

      - name: Persist temporary test result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          cat > .github/HEADLESS_TEST_RESULT.json <<EOF
          {
            "tested_sha": "${GITHUB_SHA}",
            "install": "${{ steps.install.outcome }}",
            "parse": "${{ steps.parse.outcome }}",
            "type_system": "${{ steps.type_system.outcome }}",
            "special_mechanics": "${{ steps.special_mechanics.outcome }}",
            "evolution": "${{ steps.evolution.outcome }}",
            "meta_progression": "${{ steps.meta.outcome }}",
            "weather": "${{ steps.weather.outcome }}"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/HEADLESS_TEST_RESULT.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record headless test result [skip ci]"
          git push origin HEAD:main
